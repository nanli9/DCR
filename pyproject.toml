[project]
name = "dcr"
version = "0.1.0"
description = "Reproduction of 'Distant Collision Response in Rigid Body Simulations' (SCA 2020)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "warp-lang>=1.13.0",
    "viser>=1.0.29",
    "polyscope>=2.0",
    "matplotlib>=3.5",
    # Justification (CLAUDE.md tech-stack rule): PortAudio bindings for the
    # Tier 1 LIVE E6 sound demo ONLY (dcr/sound/live.py, user-approved
    # 2026-07-11). The offline render path stays scipy-only; nothing in the
    # sim/solver imports this.
    "sounddevice>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
